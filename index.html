<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>51 Datasheet & Leaderboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1, h2, h3 {
            color: #2c3e50;
            margin-top: 10px;
        }
        
        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
        }
        .nav-tabs button {
            background-color: #bdc3c7;
            color: #2c3e50;
            margin: 0;
            border-radius: 5px 5px 0 0;
            flex: 1;
        }
        .nav-tabs button.active-tab {
            background-color: #3498db;
            color: white;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        select, input[type="text"], input[type="number"] {
            padding: 10px;
            width: calc(100% - 22px);
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            margin-bottom: 5px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 10px 0;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .hidden {
            display: none;
        }
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 5px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background-color: #3498db;
            color: white;
            vertical-align: top;
        }
        .leaderboard-table th {
            background-color: #e67e22;
        }
        .totals-row {
            font-weight: bold;
            background-color: #ecf0f1;
            font-size: 16px;
        }
        .trophies {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2px;
            margin-bottom: 5px;
            max-width: 80px;
            margin-left: auto;
            margin-right: auto;
        }
        .trophy {
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }
        .trophy.used {
            opacity: 0.2;
            cursor: not-allowed;
        }
        .results-box {
            background-color: #e8f8f5;
            border: 1px solid #1abc9c;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>51 Tracker</h1>

    <div class="nav-tabs">
        <button id="tab-game" class="active-tab" onclick="switchTab('game')">Play Game</button>
        <button id="tab-leaderboard" onclick="switchTab('leaderboard')">Leaderboard</button>
    </div>

    <!-- ==================== GAME TAB ==================== -->
    <div id="tab-content-game">
        
        <!-- Game Setup -->
        <div id="setup-section">
            <h2>Game Setup</h2>
            
            <div class="input-group">
                <label for="player-count">Number of Players:</label>
                <select id="player-count" onchange="updatePlayerInputs()">
                    <option value="2">2 Players</option>
                    <option value="3">3 Players</option>
                    <option value="4" selected>4 Players</option>
                </select>
            </div>

            <div class="input-group" id="names-container">
                <label>Player Names:</label>
                <input type="text" id="player1" placeholder="Naif">
                <input type="text" id="player2" placeholder="Semra">
                <input type="text" id="player3" placeholder="Deniz Dora">
                <input type="text" id="player4" placeholder="Player 4">
            </div>

            <div class="input-group">
                <label for="total-rounds">Number of Rounds:</label>
                <input type="number" id="total-rounds" value="11" min="1">
            </div>

            <button onclick="startGame()">Create Datasheet</button>
        </div>

        <!-- Active Datasheet -->
        <div id="game-section" class="hidden">
            <h2 id="round-title">Round 1</h2>
            
            <div id="score-inputs" class="input-group"></div>
            
            <button onclick="submitRound()">Submit Round Penalties</button>
            <button onclick="endGame()" style="background-color: #e74c3c;">End Game Now</button>

            <h3>Live Datasheet</h3>
            <p style="font-size: 12px; color: #555;">(Tap a 🏆 to deduct 100 pts)</p>
            
            <div class="table-container">
                <table id="score-table">
                    <thead>
                        <tr id="table-headers">
                            <th>Rnd</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                    </tbody>
                    <tfoot>
                        <tr id="table-totals" class="totals-row">
                            <td>Total</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>

        <!-- Final Results -->
        <div id="results-section" class="hidden">
            <h2>Game Finished!</h2>
            <div id="final-standings" class="results-box"></div>
            
            <button id="save-btn" onclick="saveToFirebase()" style="background-color: #2ecc71;">Save Game to Leaderboard</button>
            <button onclick="location.reload()" style="background-color: #7f8c8d;">Reset for New Game</button>
        </div>

    </div>

    <!-- ==================== LEADERBOARD TAB ==================== -->
    <div id="tab-content-leaderboard" class="hidden">
        <h2>All-Time Leaderboard</h2>
        <button onclick="loadLeaderboard()" style="background-color: #e67e22; margin-bottom: 15px;">Refresh Leaderboard</button>
        
        <div class="table-container">
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Name</th>
                        <th>Wins</th>
                        <th>Losses</th>
                        <th>Games</th>
                        <th>Total Pts</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <tr><td colspan="6">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Your inserted Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyABpkX1UZbesIA0ICRDHySj-43xIyENBII",
      authDomain: "tutnuva.firebaseapp.com",
      projectId: "tutnuva",
      storageBucket: "tutnuva.firebasestorage.app",
      messagingSenderId: "358820095584",
      appId: "1:358820095584:web:8f0ce4b9b2c338a5780505"
    };

    let app, db;
    try {
        if(Object.keys(firebaseConfig).length > 0) {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        }
    } catch(e) {
        console.log("Firebase not configured yet.");
    }

    let players = [];
    let totals = [];
    let currentRound = 1;
    let maxRounds = 11;
    window.finalStandingsData = []; 

    window.switchTab = function(tab) {
        document.getElementById('tab-content-game').classList.add('hidden');
        document.getElementById('tab-content-leaderboard').classList.add('hidden');
        document.getElementById('tab-game').classList.remove('active-tab');
        document.getElementById('tab-leaderboard').classList.remove('active-tab');

        document.getElementById('tab-content-' + tab).classList.remove('hidden');
        document.getElementById('tab-' + tab).classList.add('active-tab');

        if (tab === 'leaderboard') {
            window.loadLeaderboard();
        }
    };

    window.updatePlayerInputs = function() {
        const count = parseInt(document.getElementById('player-count').value);
        document.getElementById('player3').style.display = count >= 3 ? 'block' : 'none';
        document.getElementById('player4').style.display = count === 4 ? 'block' : 'none';
    };

    window.startGame = function() {
        players = [];
        const count = parseInt(document.getElementById('player-count').value);
        maxRounds = parseInt(document.getElementById('total-rounds').value) || 11;

        for (let i = 1; i <= count; i++) {
            let inputField = document.getElementById('player' + i);
            let name = inputField.value.trim();
            if (!name) name = inputField.placeholder;
            players.push(name);
        }

        totals = new Array(players.length).fill(0);

        document.getElementById('setup-section').classList.add('hidden');
        document.getElementById('game-section').classList.remove('hidden');
        document.getElementById('round-title').textContent = "Round 1 of " + maxRounds;

        window.setupTable();
        window.generateInputs();
    };

    window.setupTable = function() {
        const headerRow = document.getElementById('table-headers');
        const totalsRow = document.getElementById('table-totals');
        
        players.forEach((player, index) => {
            let th = document.createElement('th');
            
            let trophyDiv = document.createElement('div');
            trophyDiv.className = 'trophies';
            for (let i = 0; i < 15; i++) {
                let trophy = document.createElement('span');
                trophy.textContent = '🏆';
                trophy.className = 'trophy';
                trophy.onclick = function() {
                    if (!trophy.classList.contains('used')) {
                        totals[index] -= 100;
                        document.getElementById('total-' + index).textContent = totals[index];
                        trophy.classList.add('used');
                    }
                };
                trophyDiv.appendChild(trophy);
            }
            th.appendChild(trophyDiv);
            
            let nameDiv = document.createElement('div');
            nameDiv.textContent = player;
            th.appendChild(nameDiv);
            
            headerRow.appendChild(th);

            let td = document.createElement('td');
            td.id = 'total-' + index;
            td.textContent = '0';
            totalsRow.appendChild(td);
        });
    };

    window.generateInputs = function() {
        const inputDiv = document.getElementById('score-inputs');
        inputDiv.innerHTML = ''; 

        players.forEach((player, index) => {
            let input = document.createElement('input');
            input.type = 'number';
            input.id = 'input-' + index;
            input.placeholder = player + " points";
            inputDiv.appendChild(input);
        });
    };

    window.submitRound = function() {
        if (currentRound > maxRounds) return;

        const tableBody = document.getElementById('table-body');
        const tr = document.createElement('tr');
        
        let roundCell = document.createElement('td');
        roundCell.textContent = currentRound;
        tr.appendChild(roundCell);

        let roundScores = [];
        let allFilled = true;

        for (let i = 0; i < players.length; i++) {
            let val = document.getElementById('input-' + i).value;
            if (val === '') {
                allFilled = false;
                break;
            }
            roundScores.push(parseInt(val));
        }

        if (!allFilled) {
            alert("Please enter a penalty score for everyone.");
            return;
        }

        for (let i = 0; i < players.length; i++) {
            let td = document.createElement('td');
            td.textContent = roundScores[i];
            tr.appendChild(td);
            
            totals[i] += roundScores[i];
            document.getElementById('total-' + i).textContent = totals[i];
            document.getElementById('input-' + i).value = ''; 
        }

        tableBody.appendChild(tr);
        currentRound++;

        if (currentRound > maxRounds) {
            window.endGame();
        } else {
            document.getElementById('round-title').textContent = "Round " + currentRound + " of " + maxRounds;
        }
    };

    window.endGame = function() {
        document.getElementById('game-section').classList.add('hidden');
        document.getElementById('results-section').classList.remove('hidden');

        let standings = [];
        for (let i = 0; i < players.length; i++) {
            standings.push({ name: players[i], score: totals[i] });
        }

        standings.sort((a, b) => a.score - b.score);
        window.finalStandingsData = standings;

        let resultHTML = "<h3>Final Standings:</h3>";
        let placements = ["🥇 1st Place", "🥈 2nd Place", "🥉 3rd Place", "💀 4th Place"];

        for (let i = 0; i < standings.length; i++) {
            resultHTML += "<p><strong>" + (placements[i] || (i+1)+"th") + ":</strong> " + standings[i].name + " (" + standings[i].score + " points)</p>";
        }

        document.getElementById('final-standings').innerHTML = resultHTML;
    };

    window.saveToFirebase = async function() {
        if (!db) {
            alert("Firebase is not configured properly.");
            return;
        }
        
        const saveBtn = document.getElementById('save-btn');
        saveBtn.textContent = "Saving to Cloud...";
        saveBtn.disabled = true;

        try {
            const standings = window.finalStandingsData;
            
            for (let i = 0; i < standings.length; i++) {
                const player = standings[i];
                const playerId = player.name.toLowerCase().trim();
                
                let isWinner = (i === 0) ? 1 : 0;
                let isLoser = (i === standings.length - 1 && standings.length > 1) ? 1 : 0;

                const playerRef = doc(db, "players", playerId);
                const snap = await getDoc(playerRef);

                if (snap.exists()) {
                    await updateDoc(playerRef, {
                        wins: increment(isWinner),
                        losses: increment(isLoser),
                        points: increment(player.score),
                        gamesPlayed: increment(1)
                    });
                } else {
                    await setDoc(playerRef, {
                        name: player.name,
                        wins: isWinner,
                        losses: isLoser,
                        points: player.score,
                        gamesPlayed: 1
                    });
                }
            }
            alert("Scores successfully saved to the All-Time Leaderboard!");
            saveBtn.textContent = "Saved ✓";
        } catch(error) {
            console.error(error);
            alert("Error saving data. Make sure Firestore is enabled in Test Mode.");
            saveBtn.textContent = "Try Saving Again";
            saveBtn.disabled = false;
        }
    };

    window.loadLeaderboard = async function() {
        if (!db) return;

        document.getElementById('leaderboard-body').innerHTML = "<tr><td colspan='6'>Loading data from Cloud...</td></tr>";

        try {
            const querySnapshot = await getDocs(collection(db, "players"));
            let allPlayers = [];
            
            querySnapshot.forEach((doc) => {
                allPlayers.push(doc.data());
            });

            allPlayers.sort((a, b) => {
                if (b.wins !== a.wins) return b.wins - a.wins;
                return a.points - b.points; 
            });

            let html = "";
            allPlayers.forEach((p, index) => {
                html += `<tr>
                    <td><strong>${index + 1}</strong></td>
                    <td>${p.name}</td>
                    <td>${p.wins}</td>
                    <td>${p.losses}</td>
                    <td>${p.gamesPlayed}</td>
                    <td>${p.points}</td>
                </tr>`;
            });

            if (allPlayers.length === 0) {
                html = "<tr><td colspan='6'>No games have been saved yet!</td></tr>";
            }

            document.getElementById('leaderboard-body').innerHTML = html;
        } catch(error) {
            console.error(error);
            document.getElementById('leaderboard-body').innerHTML = "<tr><td colspan='6'>Error loading. Did you remember to enable 'Test Mode' in Firestore?</td></tr>";
        }
    };

    window.updatePlayerInputs();
</script>

</body>
</html>
