<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>51 Score Tracker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1, h2, h3 {
            color: #2c3e50;
            margin-top: 10px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        select, input[type="text"], input[type="number"] {
            padding: 10px;
            width: calc(100% - 22px);
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            margin-bottom: 5px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 10px 0;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #2980b9;
        }
        .hidden {
            display: none;
        }
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 5px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background-color: #3498db;
            color: white;
            vertical-align: top;
        }
        .totals-row {
            font-weight: bold;
            background-color: #ecf0f1;
            font-size: 16px;
        }
        .trophies {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2px;
            margin-bottom: 5px;
            max-width: 80px;
            margin-left: auto;
            margin-right: auto;
        }
        .trophy {
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }
        .trophy.used {
            opacity: 0.2;
            cursor: not-allowed;
        }
        .results-box {
            background-color: #e8f8f5;
            border: 1px solid #1abc9c;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>51 Datasheet</h1>

    <!-- SECTION 1: Game Setup -->
    <div id="setup-section">
        <h2>Game Setup</h2>
        
        <div class="input-group">
            <label for="player-count">Number of Players:</label>
            <select id="player-count" onchange="updatePlayerInputs()">
                <option value="2">2 Players</option>
                <option value="3">3 Players</option>
                <option value="4" selected>4 Players</option>
            </select>
        </div>

        <div class="input-group" id="names-container">
            <label>Player Names:</label>
            <input type="text" id="player1" placeholder="Player 1">
            <input type="text" id="player2" placeholder="Player 2">
            <input type="text" id="player3" placeholder="Player 3">
            <input type="text" id="player4" placeholder="Player 4">
        </div>

        <div class="input-group">
            <label for="total-rounds">Number of Rounds:</label>
            <input type="number" id="total-rounds" value="11" min="1">
        </div>

        <button onclick="startGame()">Create Datasheet</button>
    </div>

    <!-- SECTION 2: Active Datasheet -->
    <div id="game-section" class="hidden">
        <h2 id="round-title">Round 1</h2>
        
        <!-- Score Inputs for Current Round -->
        <div id="score-inputs" class="input-group"></div>
        
        <button onclick="submitRound()">Submit Round Penalties</button>
        <button onclick="endGame()" style="background-color: #e74c3c;">End Game Now</button>

        <h3>Live Datasheet</h3>
        <p style="font-size: 12px; color: #555;">(Tap a 🏆 to deduct 100 pts)</p>
        
        <div class="table-container">
            <table id="score-table">
                <thead>
                    <tr id="table-headers">
                        <th>Rnd</th>
                        <!-- Player headers will generate here -->
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Round scores go here -->
                </tbody>
                <tfoot>
                    <tr id="table-totals" class="totals-row">
                        <td>Total</td>
                        <!-- Totals will go here -->
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <!-- SECTION 3: Final Results -->
    <div id="results-section" class="hidden">
        <h2>Game Finished!</h2>
        <div id="final-standings" class="results-box"></div>
        <button onclick="location.reload()">Start New Game</button>
    </div>
</div>

<script>
    let players = [];
    let totals = [];
    let currentRound = 1;
    let maxRounds = 11;

    // Show/Hide player name inputs based on dropdown
    function updatePlayerInputs() {
        const count = parseInt(document.getElementById('player-count').value);
        document.getElementById('player3').style.display = count >= 3 ? 'block' : 'none';
        document.getElementById('player4').style.display = count === 4 ? 'block' : 'none';
    }

    function startGame() {
        players = [];
        const count = parseInt(document.getElementById('player-count').value);
        maxRounds = parseInt(document.getElementById('total-rounds').value) || 11;

        // Gather names
        for (let i = 1; i <= count; i++) {
            let name = document.getElementById('player' + i).value.trim();
            if (!name) name = "Player " + i; 
            players.push(name);
        }

        totals = new Array(players.length).fill(0);

        // Switch screens
        document.getElementById('setup-section').classList.add('hidden');
        document.getElementById('game-section').classList.remove('hidden');
        document.getElementById('round-title').textContent = "Round 1 of " + maxRounds;

        setupTable();
        generateInputs();
    }

    function setupTable() {
        const headerRow = document.getElementById('table-headers');
        const totalsRow = document.getElementById('table-totals');
        
        players.forEach((player, index) => {
            // Create Header Cell
            let th = document.createElement('th');
            
            // 1. Create Trophies
            let trophyDiv = document.createElement('div');
            trophyDiv.className = 'trophies';
            for (let i = 0; i < 15; i++) {
                let trophy = document.createElement('span');
                trophy.textContent = '🏆';
                trophy.className = 'trophy';
                trophy.onclick = function() {
                    if (!trophy.classList.contains('used')) {
                        totals[index] -= 100;
                        document.getElementById('total-' + index).textContent = totals[index];
                        trophy.classList.add('used');
                    }
                };
                trophyDiv.appendChild(trophy);
            }
            th.appendChild(trophyDiv);
            
            // 2. Add Player Name
            let nameDiv = document.createElement('div');
            nameDiv.textContent = player;
            th.appendChild(nameDiv);
            
            headerRow.appendChild(th);

            // Create Total Cell
            let td = document.createElement('td');
            td.id = 'total-' + index;
            td.textContent = '0';
            totalsRow.appendChild(td);
        });
    }

    function generateInputs() {
        const inputDiv = document.getElementById('score-inputs');
        inputDiv.innerHTML = ''; 

        players.forEach((player, index) => {
            let input = document.createElement('input');
            input.type = 'number';
            input.id = 'input-' + index;
            input.placeholder = player + "'s Penalty Points";
            inputDiv.appendChild(input);
        });
    }

    function submitRound() {
        if (currentRound > maxRounds) return;

        const tableBody = document.getElementById('table-body');
        const tr = document.createElement('tr');
        
        // Add Round Number
        let roundCell = document.createElement('td');
        roundCell.textContent = currentRound;
        tr.appendChild(roundCell);

        let roundScores = [];
        let allFilled = true;

        // Check if all scores are entered
        for (let i = 0; i < players.length; i++) {
            let val = document.getElementById('input-' + i).value;
            if (val === '') {
                allFilled = false;
                break;
            }
            roundScores.push(parseInt(val));
        }

        if (!allFilled) {
            alert("Please enter a penalty score for everyone.");
            return;
        }

        // Add scores to table and update totals
        for (let i = 0; i < players.length; i++) {
            let td = document.createElement('td');
            td.textContent = roundScores[i];
            tr.appendChild(td);
            
            totals[i] += roundScores[i];
            document.getElementById('total-' + i).textContent = totals[i];
            document.getElementById('input-' + i).value = ''; // clear input for next round
        }

        tableBody.appendChild(tr);
        currentRound++;

        if (currentRound > maxRounds) {
            endGame();
        } else {
            document.getElementById('round-title').textContent = "Round " + currentRound + " of " + maxRounds;
        }
    }

    function endGame() {
        document.getElementById('game-section').classList.add('hidden');
        document.getElementById('results-section').classList.remove('hidden');

        // Pair names with their final scores
        let standings = [];
        for (let i = 0; i < players.length; i++) {
            standings.push({ name: players[i], score: totals[i] });
        }

        // Sort by lowest penalty
        standings.sort((a, b) => a.score - b.score);

        let resultHTML = "<h3>Final Standings:</h3>";
        let placements = ["1st Place", "2nd Place", "3rd Place", "4th Place"];

        for (let i = 0; i < standings.length; i++) {
            resultHTML += "<p><strong>" + placements[i] + ":</strong> " + standings[i].name + " (" + standings[i].score + " points)</p>";
        }

        document.getElementById('final-standings').innerHTML = resultHTML;
    }
    
    // Initialize the setup screen on load
    updatePlayerInputs();
</script>

</body>
</html>
